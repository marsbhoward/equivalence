<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real numbers on a
       notched iPhone. Without it the insets are all 0 and the canvas runs under the Dynamic
       Island and the home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- The Home Screen app (home.js says why): the bar's colour, the icon, the name under it. -->
  <meta name="theme-color" content="#0b0b10">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Equivalence">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b0b10; overflow: hidden;
                 overscroll-behavior: none; }
    /* Screen.safeArea is unreliable on WebGL, so the inset is applied to the CANVAS here rather
       than compensated for inside Unity. The game keeps drawing to its full viewport and simply
       never occupies the cut-out. */
    #unity-container {
      position: fixed; inset: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0b0b10;
                    /* the game has its own touch handling; the browser must not also pan/zoom */
                    touch-action: none; }
    #unity-loading { position: absolute; inset: 0; display: flex; align-items: center;
                     justify-content: center; color: #6d6d84; font: 14px/1.4 system-ui, sans-serif;
                     letter-spacing: .18em; text-transform: uppercase; }
    #unity-rotate { position: fixed; inset: 0; display: none; align-items: center;
                    justify-content: center; background: #0b0b10; color: #8a8aa4;
                    font: 14px/1.6 system-ui, sans-serif; text-align: center; z-index: 10;
                    letter-spacing: .1em; }
    /* Landscape only, for the reason the project already documents: the arena is 24 x 14 world
       units against a camera showing ~17 x 9.6, so portrait shows a third of the fight. */
    #home-hint { position: fixed; z-index: 5; left: 50%; top: calc(env(safe-area-inset-top) + 10px);
                 transform: translate(-50%, -8px); opacity: 0; transition: opacity .4s, transform .4s;
                 display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 14px;
                 background: rgba(11, 11, 16, .92); border: 1px solid #3a3226; border-radius: 3px;
                 color: #cfc6b4; font: 13px/1.3 system-ui, sans-serif; letter-spacing: .04em;
                 white-space: nowrap; }
    #home-hint.shown { opacity: 1; transform: translate(-50%, 0); }
    #home-hint[hidden] { display: none; }
    #home-hint svg { width: 14px; height: 16px; vertical-align: -3px; margin: 0 2px; }
    #home-hint b { color: #e2c487; font-weight: 600; }
    #home-hint button { border: 0; background: none; color: #8a8aa4; font: 18px/1 system-ui, sans-serif;
                        padding: 2px 6px; cursor: pointer; }
    @media (orientation: portrait) {
      #unity-rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading">loading</div>
  </div>
  <div id="unity-rotate">rotate your device to play</div>
  <div id="home-hint" hidden>
    <span>Play full screen: tap
      <svg viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-label="Share">
        <path d="M7 1v9M4 4l3-3 3 3M4.5 7H2v8h10V7H9.5"/></svg>
      then <b>Add to Home Screen</b></span>
    <button type="button" aria-label="Close">&times;</button>
  </div>
  <script src="home.js"></script>

  <!-- The wallet connector (web/connector, built by esbuild into connector/). Loaded BEFORE the
       Unity instance so the game sees window.EquivalenceChain on its first look. Absent or failed,
       the game plays on without wallet features - saves never depend on it: C# writes them to the
       service over HTTP. The service serves this page (/play), so its API is SAME-ORIGIN: "" is
       the page's own origin. A page hosted anywhere else names the service's full URL here and is
       added to the service's ALLOWED_ORIGINS. -->
  <script>window.EQUIVALENCE_SERVICE = "";</script>
  <!-- No onerror="" here: the page's Content-Security-Policy (web/service/src/play.ts) runs no inline
       handlers. A missing connector is reported by the script below instead. -->
  <script src="connector/equivalence-chain.js"></script>

  <!-- Unity 2020+ template variables (triple braces). The old percent-sign form is not replaced
       any more - it shipped literally until 2026-10-13, unnoticed because the project built with
       Unity's default template. -->
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    if (!window.EquivalenceChain) console.warn('[Equivalence] no chain connector; running on local storage');
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // Retina matters here: the project's pixel-perfect snap works in real device pixels, and
      // at dpr 1 a texel would land on a fraction of a physical pixel on every phone.
      devicePixelRatio: window.devicePixelRatio || 1,
      matchWebGLToCanvasSize: true,
      // An error the PAGE did not raise - Safari's share sheet ("Add to Home Screen") and extensions
      // run scripts of their own, and one from another origin reaches window.onerror only as a bare
      // "Script error." - is logged, not shown: Unity's default puts up a fatal-looking alert for it
      // while the game runs on untouched. Anything else goes to Unity's own handler (false).
      errorHandler: function (message) {
        // (the loader appends a line break and any stack to the message - hence the trim)
        if (typeof message === 'string' && /^Script error\.?$/.test(message.trim())) {
          console.warn('[Equivalence] ignored an opaque error from a script outside the page');
          return true;
        }
        return false;
      },
    }).then(function (instance) {
      document.querySelector("#unity-loading").style.display = "none";
      window.unityInstance = instance;      // the connector may need it for host -> game calls
    }).catch(function (e) {
      document.querySelector("#unity-loading").textContent = "failed to load";
      console.error(e);
    });
  </script>
</body>
</html>
